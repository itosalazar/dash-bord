<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Afternoon lounge — warm-modernist living room (original demo illustration)</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77734f"/>
      <stop offset="1" stop-color="#55543a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e5c36"/>
      <stop offset="1" stop-color="#6c4227"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ead2"/>
      <stop offset="1" stop-color="#e6cfa4"/>
    </linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c25f31"/>
      <stop offset="1" stop-color="#9a4220"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8dbbf"/>
      <stop offset="0.6" stop-color="#d9c7a3"/>
      <stop offset="1" stop-color="#b9a47f"/>
    </linearGradient>
    <linearGradient id="walnut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b3f24"/>
      <stop offset="1" stop-color="#4a2a17"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- wall + floor -->
  <rect width="1200" height="800" fill="url(#wall)"/>
  <rect y="600" width="1200" height="200" fill="url(#floor)"/>
  <rect y="596" width="1200" height="6" fill="#3e2a1a" opacity="0.5"/>

  <!-- window -->
  <rect x="0" y="0" width="175" height="610" fill="url(#window)"/>
  <g fill="#8a9a5b" opacity="0.75" filter="url(#soft)">
    <ellipse cx="40" cy="420" rx="70" ry="90"/>
    <ellipse cx="120" cy="470" rx="60" ry="70"/>
    <ellipse cx="70" cy="250" rx="45" ry="60" fill="#a3ae74"/>
  </g>
  <rect x="0" y="0" width="175" height="610" fill="none" stroke="#3a281a" stroke-width="14"/>
  <rect x="84" y="0" width="8" height="610" fill="#3a281a"/>
  <rect x="175" y="0" width="22" height="610" fill="#d9c9a6" opacity="0.5"/>

  <!-- sunlight shafts -->
  <g fill="#f6dca8" opacity="0.2">
    <polygon points="175,40 420,0 1030,520 760,600 175,300"/>
    <polygon points="175,330 175,600 520,800 900,800 600,600"/>
  </g>

  <!-- leaf shadows -->
  <g fill="#2f2f1f" opacity="0.16" filter="url(#soft)">
    <ellipse cx="980" cy="120" rx="60" ry="16" transform="rotate(-30 980 120)"/>
    <ellipse cx="1040" cy="170" rx="70" ry="18" transform="rotate(20 1040 170)"/>
    <ellipse cx="930" cy="210" rx="55" ry="15" transform="rotate(-50 930 210)"/>
    <ellipse cx="1100" cy="90" rx="65" ry="17" transform="rotate(-10 1100 90)"/>
    <ellipse cx="1010" cy="260" rx="50" ry="14" transform="rotate(35 1010 260)"/>
    <ellipse cx="1130" cy="230" rx="60" ry="16" transform="rotate(-40 1130 230)"/>
    <path d="M880 330 C 960 220, 1060 160, 1200 120" stroke="#2f2f1f" stroke-width="6" fill="none"/>
  </g>

  <!-- art on wall -->
  <rect x="760" y="150" width="190" height="200" fill="#3b2a1f"/>
  <rect x="760" y="150" width="190" height="200" fill="#000" opacity="0.15" transform="translate(10 10)" filter="url(#soft)"/>
  <rect x="760" y="150" width="190" height="200" fill="#4a3426"/>
  <circle cx="830" cy="230" r="34" fill="#b4532a" opacity="0.85"/>
  <rect x="800" y="290" width="110" height="10" fill="#d9c7a3" opacity="0.6"/>

  <!-- sideboard -->
  <ellipse cx="880" cy="612" rx="260" ry="18" fill="#2a1a0f" opacity="0.35" filter="url(#soft)"/>
  <rect x="640" y="440" width="480" height="160" rx="6" fill="url(#walnut)"/>
  <rect x="640" y="440" width="480" height="14" fill="#7b4a2b"/>
  <g stroke="#3a2214" stroke-width="3">
    <line x1="800" y1="458" x2="800" y2="596"/>
    <line x1="960" y1="458" x2="960" y2="596"/>
  </g>
  <rect x="660" y="596" width="10" height="14" fill="#2f1c10"/>
  <rect x="1090" y="596" width="10" height="14" fill="#2f1c10"/>

  <!-- books + lamp on sideboard -->
  <rect x="900" y="414" width="120" height="10" fill="#e3d6bc"/>
  <rect x="905" y="424" width="112" height="9" fill="#a8956f"/>
  <rect x="898" y="433" width="122" height="8" fill="#efe4cd"/>
  <rect x="1046" y="380" width="14" height="62" fill="#7d6c58"/>
  <path d="M1008 392 Q 1053 330 1098 392 Z" fill="#a39079"/>
  <ellipse cx="1053" cy="393" rx="46" ry="6" fill="#8c7a64"/>

  <!-- rug -->
  <ellipse cx="560" cy="700" rx="520" ry="78" fill="#b98c5c"/>
  <ellipse cx="560" cy="700" rx="520" ry="78" fill="none" stroke="#9c7346" stroke-width="2" stroke-dasharray="2 9"/>
  <ellipse cx="560" cy="700" rx="470" ry="62" fill="none" stroke="#a87d50" stroke-width="2" stroke-dasharray="1 7"/>

  <!-- lounge chair -->
  <ellipse cx="330" cy="672" rx="190" ry="22" fill="#2a1a0f" opacity="0.4" filter="url(#soft)"/>
  <rect x="215" y="390" width="200" height="200" rx="80" fill="#9a4220"/>
  <rect x="190" y="500" width="300" height="160" rx="70" fill="url(#chair)"/>
  <rect x="205" y="508" width="270" height="40" rx="20" fill="#d06a39" opacity="0.5"/>
  <rect x="190" y="610" width="300" height="50" rx="25" fill="#8a3a1b" opacity="0.6"/>

  <!-- travertine drum table -->
  <ellipse cx="690" cy="690" rx="150" ry="20" fill="#2a1a0f" opacity="0.4" filter="url(#soft)"/>
  <rect x="580" y="590" width="220" height="100" fill="url(#stone)"/>
  <ellipse cx="690" cy="690" rx="110" ry="14" fill="#b9a47f"/>
  <rect x="580" y="590" width="220" height="100" fill="url(#stone)"/>
  <ellipse cx="690" cy="590" rx="150" ry="26" fill="#ecdfc4"/>
  <ellipse cx="690" cy="590" rx="150" ry="26" fill="none" stroke="#cbb68f" stroke-width="2"/>
  <path d="M540 590 L 540 606 Q 690 650 840 606 L 840 590 Q 690 632 540 590 Z" fill="#d6c4a0"/>
  <g fill="#bca883" opacity="0.8">
    <ellipse cx="610" cy="630" rx="9" ry="2"/>
    <ellipse cx="660" cy="655" rx="14" ry="2"/>
    <ellipse cx="720" cy="640" rx="10" ry="2"/>
    <ellipse cx="760" cy="668" rx="12" ry="2"/>
    <ellipse cx="640" cy="675" rx="8" ry="1.5"/>
  </g>

  <!-- bowls + vase with olive branches -->
  <path d="M600 578 Q 625 600 650 578 Z" fill="#8f6a4a"/>
  <ellipse cx="625" cy="578" rx="25" ry="5" fill="#a07a58"/>
  <g stroke="#4f5432" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M735 520 C 720 450, 690 400, 640 350"/>
    <path d="M735 520 C 745 440, 780 390, 820 330"/>
    <path d="M735 520 C 735 450, 742 400, 735 320"/>
    <path d="M700 430 C 680 420, 670 410, 655 395"/>
    <path d="M770 410 C 790 400, 800 385, 812 370"/>
  </g>
  <g fill="#6f7646">
    <ellipse cx="650" cy="358" rx="16" ry="5" transform="rotate(35 650 358)"/>
    <ellipse cx="668" cy="378" rx="15" ry="5" transform="rotate(-25 668 378)"/>
    <ellipse cx="690" cy="402" rx="14" ry="4.5" transform="rotate(40 690 402)"/>
    <ellipse cx="660" cy="404" rx="13" ry="4" transform="rotate(10 660 404)"/>
    <ellipse cx="736" cy="330" rx="15" ry="5" transform="rotate(80 736 330)"/>
    <ellipse cx="726" cy="370" rx="14" ry="4.5" transform="rotate(-60 726 370)"/>
    <ellipse cx="746" cy="400" rx="14" ry="4.5" transform="rotate(60 746 400)"/>
    <ellipse cx="812" cy="340" rx="15" ry="5" transform="rotate(-40 812 340)"/>
    <ellipse cx="796" cy="368" rx="14" ry="4.5" transform="rotate(30 796 368)"/>
    <ellipse cx="808" cy="385" rx="13" ry="4" transform="rotate(-20 808 385)"/>
    <ellipse cx="770" cy="420" rx="14" ry="4.5" transform="rotate(-50 770 420)"/>
  </g>
  <g fill="#8a915a">
    <ellipse cx="700" cy="380" rx="11" ry="3.5" transform="rotate(-30 700 380)"/>
    <ellipse cx="760" cy="350" rx="11" ry="3.5" transform="rotate(50 760 350)"/>
  </g>
  <path d="M712 586 C 690 560, 700 530, 722 520 L 748 520 C 770 530, 780 560, 758 586 Z" fill="#cfc0a5"/>
  <path d="M722 520 L 748 520 L 744 510 L 726 510 Z" fill="#bfae90"/>
  <path d="M712 586 C 702 572, 702 556, 708 544" stroke="#e6dbc6" stroke-width="4" fill="none" opacity="0.7"/>
</svg>
