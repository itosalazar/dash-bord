<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Clay arch — plaster archway with olive tree (original demo illustration)</title>
  <defs>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c47648"/>
      <stop offset="1" stop-color="#9c5631"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ead6"/>
      <stop offset="1" stop-color="#ecc897"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b085"/>
      <stop offset="1" stop-color="#b98a5c"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#clay)"/>

  <!-- arch opening -->
  <path d="M430 640 L 430 300 A 190 190 0 0 1 810 300 L 810 640 Z" fill="url(#sky)"/>
  <path d="M430 640 L 430 520 Q 560 470 650 500 Q 740 520 810 480 L 810 640 Z" fill="#cf9566"/>
  <path d="M430 640 L 430 560 Q 600 530 810 570 L 810 640 Z" fill="#b97a4c"/>
  <circle cx="700" cy="260" r="46" fill="#fbe9c6"/>
  <!-- arch reveal (thickness) -->
  <path d="M430 640 L 430 300 A 190 190 0 0 1 455 205 L 470 215 A 175 175 0 0 0 450 300 L 450 640 Z" fill="#8a4a28" opacity="0.6"/>

  <!-- floor -->
  <rect y="640" width="1200" height="160" fill="url(#ground)"/>
  <rect y="636" width="1200" height="6" fill="#7a4026" opacity="0.4"/>
  <!-- light cast through the arch -->
  <path d="M430 640 L 810 640 L 980 800 L 300 800 Z" fill="#f7deb0" opacity="0.35"/>

  <!-- pot + olive tree -->
  <ellipse cx="250" cy="760" rx="120" ry="16" fill="#3a1f10" opacity="0.35" filter="url(#blur)"/>
  <path d="M170 620 L 330 620 L 305 760 L 195 760 Z" fill="#8d4527"/>
  <rect x="160" y="604" width="180" height="22" rx="6" fill="#a2552f"/>
  <g stroke="#5a4130" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M250 606 C 245 520, 220 470, 190 410"/>
    <path d="M248 540 C 270 480, 300 440, 320 380"/>
  </g>
  <g fill="#6d7445">
    <ellipse cx="180" cy="380" rx="70" ry="48"/>
    <ellipse cx="250" cy="340" rx="80" ry="55"/>
    <ellipse cx="330" cy="370" rx="62" ry="44"/>
    <ellipse cx="210" cy="440" rx="50" ry="30"/>
  </g>
  <g fill="#8a915a" opacity="0.8">
    <ellipse cx="230" cy="320" rx="40" ry="22"/>
    <ellipse cx="320" cy="350" rx="30" ry="18"/>
    <ellipse cx="170" cy="370" rx="30" ry="16"/>
  </g>

  <!-- wooden stool -->
  <ellipse cx="960" cy="752" rx="90" ry="12" fill="#3a1f10" opacity="0.35" filter="url(#blur)"/>
  <rect x="900" y="640" width="120" height="110" rx="10" fill="#6f4126"/>
  <ellipse cx="960" cy="640" rx="60" ry="14" fill="#8a5634"/>
  <g stroke="#5a321c" stroke-width="2" opacity="0.6">
    <line x1="920" y1="660" x2="920" y2="745"/>
    <line x1="945" y1="660" x2="945" y2="748"/>
    <line x1="975" y1="660" x2="975" y2="748"/>
    <line x1="1000" y1="660" x2="1000" y2="745"/>
  </g>
  <path d="M930 640 C 920 610, 935 595, 960 595 C 985 595, 1000 610, 990 640 Z" fill="#e8dcc3"/>
</svg>
