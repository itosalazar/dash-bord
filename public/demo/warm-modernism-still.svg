<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Stoneware still life on a travertine plinth (original demo illustration)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ece0c8"/>
      <stop offset="1" stop-color="#d6c3a2"/>
    </linearGradient>
    <linearGradient id="plinth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2d3b3"/>
      <stop offset="1" stop-color="#c3ad86"/>
    </linearGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d47b50"/>
      <stop offset="1" stop-color="#a65230"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d573b"/>
      <stop offset="1" stop-color="#523621"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="900" cy="230" r="150" fill="#f4c98a" opacity="0.35" filter="url(#blur)"/>
  <rect y="560" width="1200" height="240" fill="#cbb48f"/>

  <!-- long shadows -->
  <g fill="#4a3320" opacity="0.14" filter="url(#blur)">
    <polygon points="520,470 600,470 1000,560 860,560"/>
    <polygon points="660,470 760,470 1150,560 1000,560"/>
  </g>

  <!-- plinth -->
  <rect x="360" y="470" width="480" height="330" fill="url(#plinth)"/>
  <rect x="360" y="462" width="480" height="14" fill="#efe4cc"/>
  <g fill="#b8a27c" opacity="0.7">
    <ellipse cx="420" cy="540" rx="18" ry="3"/>
    <ellipse cx="520" cy="600" rx="26" ry="3"/>
    <ellipse cx="640" cy="560" rx="14" ry="2.5"/>
    <ellipse cx="740" cy="640" rx="22" ry="3"/>
    <ellipse cx="460" cy="700" rx="20" ry="3"/>
    <ellipse cx="700" cy="740" rx="28" ry="3"/>
    <ellipse cx="800" cy="530" rx="12" ry="2"/>
  </g>

  <!-- tall bottle -->
  <path d="M520 470 L 520 330 C 520 300, 545 290, 548 260 L 548 200 L 572 200 L 572 260 C 575 290, 600 300, 600 330 L 600 470 Z" fill="url(#bottle)"/>
  <rect x="544" y="192" width="32" height="10" rx="3" fill="#3f2a19"/>
  <path d="M530 335 L 530 460" stroke="#a07a58" stroke-width="5" opacity="0.5" stroke-linecap="round"/>

  <!-- round terracotta jar -->
  <path d="M640 470 C 610 440, 610 370, 650 350 L 660 330 L 740 330 L 750 350 C 790 370, 790 440, 760 470 Z" fill="url(#jar)"/>
  <rect x="656" y="320" width="88" height="14" rx="5" fill="#b9603a"/>
  <path d="M640 400 Q 700 412 760 400" stroke="#8c4224" stroke-width="3" fill="none" opacity="0.5"/>

  <!-- small cream bowl -->
  <path d="M760 470 Q 800 520 840 470 Z" fill="#f2ebdc" transform="translate(-30 -10)"/>
  <ellipse cx="780" cy="460" rx="40" ry="7" fill="#e5dac6"/>

  <!-- dried stem -->
  <path d="M560 200 C 560 140, 590 90, 640 60" stroke="#7a6a4f" stroke-width="3" fill="none"/>
  <g fill="#9c8a66">
    <ellipse cx="600" cy="110" rx="12" ry="4" transform="rotate(-40 600 110)"/>
    <ellipse cx="620" cy="82" rx="12" ry="4" transform="rotate(30 620 82)"/>
    <ellipse cx="580" cy="140" rx="11" ry="3.5" transform="rotate(20 580 140)"/>
    <ellipse cx="642" cy="62" rx="10" ry="3.5" transform="rotate(-20 642 62)"/>
  </g>
</svg>
